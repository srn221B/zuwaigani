[package]
name = "zuwaigani"
version = "0.1.0"
edition = "2024"

[dependencies]
zuwaigani-core = { path = "../core" }
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive", "env"] }
polars = { version = "0.55.2", features = ["lazy", "csv", "parquet", "is_in", "is_between", "strings", "regex", "is_unique"] }
postgres = "0.19.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"

[lints]
workspace = true
